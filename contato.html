<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Contato</title>
</head>

<body>

    <form method="post" action="sucesso.html">

        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Ex: Zezinff" required autofocus>
        <br>

        <label>Numero:</label>
        <input type="number" name="numero" placeholder="Ex: 61-998605284" required pattern="[0-9]{2}-[0-9]{10}">
        <br>


        <label>E-mail:</label>
        <input type="email" name="email" placeholder="Ex: Luizfellype@gmail.com" required>
        <br>

        <label>Correto?</label>
        <input type="radio" name="correto" value="S" required> Sim
        <input type="radio" name="correto" value="N" required> Nao
        <br>

        <label for="endereco">Digite o seu endereco:</label><br>
        <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua A, 123 - Bairro" required>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
